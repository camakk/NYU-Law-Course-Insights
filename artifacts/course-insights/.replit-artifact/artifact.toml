kind = "web"
previewPath = "/"
title = "NYU Course Insights"
description = "Explore NYU course evaluations, view professors’ teaching scores across classes, and compare instructors for each course using the uploaded evaluation data."
version = "1.0.0"
id = "artifacts/course-insights"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25159

[services.development]
run = "pnpm --filter @workspace/course-insights run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/course-insights", "run", "build" ]
serve = "static"
publicDir = "artifacts/course-insights/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25159"
BASE_PATH = "/"
